<!--The content below is only a placeholder and can be replaced.-->
<div id="chart">
  <apx-chart
    [series]="chartOptions.series"
    [chart]="chartOptions.chart"
    [labels]="chartOptions.labels"
    [responsive]="chartOptions.responsive"
  ></apx-chart>

  <div class="sm:w-1/3 p-2 bg-transparent min-w-[30rem] pl-8">
    <div class="flex flex-row justify-between items-right pr-5">
      <div class="flex flex-col items-center">
        <i class="pi pi-book text-6xl pb-2"></i>
        <p class="text-xs whitespace-nowrap">Directives, Policies and Procedures</p>
      </div>
      <div class="flex flex-col items-center">
        <i class="pi pi-megaphone text-6xl pb-2"></i>
        <p class="text-xs">Notifications</p>
      </div>
    </div>
  </div>
</div>
