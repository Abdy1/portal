<div class="card">
  <p-table [value]="shifts" [rows]="10" [paginator]="true" [tableStyle]="{'min-width': '60rem'}">
    <ng-template pTemplate="header">
      <tr>
        <th>ID</th>
        <th>Name</th>
        <th>Start Time</th>
        <th>End Time</th>
      </tr>
    </ng-template>

    <ng-template pTemplate="body" let-shift>
      <tr>
        <td>{{ shift.id }}</td>
        <td>{{ shift.name }}</td>
        <td>{{ shift.startTime }}</td>
        <td>{{ shift.endTime }}</td>
      </tr>
    </ng-template>

    <ng-template pTemplate="emptymessage">
      <tr>
        <td colspan="4">No Data found.</td>
      </tr>
    </ng-template>
  </p-table>
</div>
