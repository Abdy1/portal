<div>
    <form #addDivForm="ngForm" (ngSubmit)="addScheduleType(addDivForm)">
     
  
  
  
  
  
      <div class="row" style="margin: 10%;">
  
        <div class="col mb-4">
          <label for="name" class="block mb-2"> Name : </label>
          <input pInputText id="name" ngModel name="name" [style]="{ width: '300px', height: '45px' }" required
            minlength="3" />
  
        </div>
        <div class="col mb-4">
          <label for="description" class="block mb-2"> Description : </label>
          <input pInputText id="description" ngModel name="description" [style]="{ width: '300px', height: '45px' }"
            required minlength="3" />
        </div>
  
  
      </div>
  
  
                
                <div class="buttonDiv" style="margin-left: 37%;">
                  
                  <p-button label="Add Schedule Type" [disabled]="addDivForm.invalid!" type="submit"></p-button>
                </div>
  </form>
  </div>
